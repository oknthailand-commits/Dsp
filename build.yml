name: Build GoloPine DSP 7CH APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check Android project
        shell: bash
        run: |
          set -euxo pipefail
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          java -version
          gradle --version
          echo "=== PROJECT ==="
          find app/src/main -maxdepth 4 -type f | sort

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee build.log

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail
          find app/build/outputs -type f -name "*.apk" -print
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoloPine-DSP-7CH-v2.6.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Show build error
        if: failure()
        shell: bash
        run: |
          echo "===== BUILD ERROR ====="
          if [ -f build.log ]; then
            grep -n -E "error:|ERROR|FAILURE|What went wrong|Caused by:" build.log | tail -120 || true
            echo "===== LAST 160 LINES ====="
            tail -160 build.log
          fi
